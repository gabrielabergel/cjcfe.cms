title: Actualités

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeSort: true
  changeTemplate: false
  changeSlug: true
  delete: true
  changeStatus: true

num: default

tabs:
  content:
    icon: text
    label: Contenu
    sections:
      header:
        type: fields
        fields:
          titre:
            label: Titre
            type: blocks
            width: 1/2
            fieldsets:
              - heading
          soustitre:
            label: Sous-titre
            type: blocks
            width: 1/2
            fieldsets:
              - text
      articles:
        label: Liste des articles
        type: pages
        template: article
        sortBy: date desc
        sortable: true
        info: "{{ page.date.toDate('d/m/Y') }}"
        columns:
          main_title:
            label: Titre
            type: text
            value: "{{ page.main_title }}"
            width: 1/3
          date:
            label: Date
            type: text
            value: "{{ page.date.toDate('d/m/Y') }}"
            width: 1/6
          hero:
            label: Hero
            type: text
            value: "{{ page.showInHero }}"
            width: 1/12
          carousel:
            label: Carousel
            type: text
            value: "{{ page.showInCarousel }}"
            width: 1/12
          status:
            label: Statut
            type: text
            value: "{{ page.status }}"
            width: 1/6
      agenda:
        type: fields
        fields:
          evenements:
            label: Événements
            type: structure
            sortBy: date asc
            columns:
              statut:
                label: Statut
                width: 1/6
              date: true
              nom: true
              lieu: true
            fields:
              statut:
                label: Statut
                type: select
                width: 1/3
                default: publie
                options:
                  publie: Publié
                  brouillon: Brouillon
                  archive: Archivé
                help: Les événements archivés ou en brouillon peuvent rester dans le CMS sans être affichés publiquement.
              categorie:
                label: Catégorie
                type: select
                width: 1/3
                options:
                  office: Office
                  fete: Fête
                  conference: Conférence
                  ceremonie: Cérémonie
                  cours: Cours / étude
                  vie-communautaire: Vie communautaire
                  autre: Autre
              mise_en_avant:
                label: Mettre en avant
                type: toggle
                width: 1/3
                text:
                  - Non
                  - Oui
              date:
                label: Date
                type: date
                width: 1/2
              heuredebut:
                label: Heure début
                type: time
                width: 1/4
              heurefin:
                label: Heure fin
                type: time
                width: 1/4
              nom:
                label: Nom de l'événement
                type: text
                required: true
              accroche:
                label: Accroche courte
                type: text
                help: Une phrase courte pour résumer l'événement dans les listes ou futurs blocs de mise en avant.
              description:
                label: Description
                type: writer
                marks:
                  - bold
                  - italic
                  - link
                nodes:
                  - paragraph
                  - bulletList
                  - orderedList
                help: Texte public affiché quand l'événement est ouvert sur le site.
              intervenant:
                label: Intervenant / officiant
                type: text
                width: 1/2
              lieu:
                label: Lieu
                type: text
                width: 1/2
              adresse:
                label: Adresse complète
                type: textarea
                size: tiny
                buttons: false
                help: Facultatif. À remplir si le lieu seul ne suffit pas.
              participation:
                label: Participation / tarif
                type: text
                width: 1/2
                placeholder: ex. PAF 6 €, entrée libre, sur inscription...
              inscription:
                label: Modalités d'inscription
                type: text
                width: 1/2
                placeholder: ex. Inscription avant le 15 mars
              contact:
                label: Contact
                type: text
                width: 1/2
                placeholder: Email, téléphone ou WhatsApp
              lien:
                label: Lien
                type: url
                width: 1/2
              lien_texte:
                label: Texte du lien
                type: text
                width: 1/2
                placeholder: S'inscrire, En savoir plus...
              image:
                label: Image
                type: files
                max: 1
                uploads: image
              note_interne:
                label: Note interne
                type: textarea
                size: tiny
                buttons: false
                help: Non affiché sur le site.

  gazette:
    icon: document
    label: La gazette
    sections:
      gazette:
        type: fields
        fields:
          gazette_titre:
            label: Titre
            type: text
          gazette_soustitre:
            label: Sous-titre
            type: textarea
            size: small
          gazette_pdf:
            label: Fichier PDF
            type: files
            max: 1
            uploads:
              template: document
            accept:
              - application/pdf
          gazette_bouton_texte:
            label: Texte du bouton
            type: text
            default: Télécharger la gazette

  seo:
    extends: tabs/seo
