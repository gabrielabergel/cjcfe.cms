title: Infos pratiques

icon: 📋

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeSlug: true
  delete: false

tabs:
  content:
    icon: text
    label: Contenu
    sections:
      header:
        type: fields
        fields:
          titre:
            label: Titre
            type: blocks
            width: 1/3
            fieldsets:
              - heading
          soustitre:
            label: Sous-titre
            type: blocks
            width: 1/3
            fieldsets:
              - text
          cover:
            label: Cover
            type: files
            width: 1/3
            max: 1
            uploads:
              template: image

  horaires:
    icon: clock
    label: Offices
    sections:
      offices:
        type: fields
        fields:
          vendredi_soir:
            label: Office vendredi soir
            type: text
            width: 1/2
          samedi_matin:
            label: Office samedi matin
            type: text
            width: 1/2

  prieres:
    icon: heart
    label: Demande de prières
    sections:
      prieres_header:
        type: fields
        fields:
          prieres_page_titre:
            label: Titre
            type: blocks
            width: 1/3
            fieldsets:
              - heading
          prieres_page_soustitre:
            label: Sous-titre
            type: blocks
            width: 1/3
            fieldsets:
              - text
      prieres:
        type: fields
        fields:
          prieres_titre:
            label: Titre
            type: text
          prieres_texte:
            label: Paragraphe
            type: textarea
            size: medium
          prieres_bouton_texte:
            label: Texte du bouton
            type: text
            width: 1/2
          prieres_bouton_url:
            label: URL du bouton
            type: url
            width: 1/2

  activites:
    icon: list-bullet
    label: Nos activités
    sections:
      activites:
        type: fields
        fields:
          activites_titre:
            label: Titre de la section
            type: text
          activites:
            label: Activités
            type: structure
            columns:
              titre: true
              description: true
            fields:
              titre:
                label: Titre
                type: text
              description:
                label: Description
                type: textarea
                size: small

  dons:
    icon: money
    label: Cotisations et Dons
    sections:
      dons:
        type: fields
        fields:
          dons_titre:
            label: Titre
            type: text
          dons_texte:
            label: Paragraphe
            type: textarea
            size: medium
          dons_bouton_texte:
            label: Texte du bouton
            type: text
            width: 1/2
          dons_bouton_url:
            label: URL du bouton
            type: url
            width: 1/2

  deces:
    icon: heart
    label: Accompagnement décès
    sections:
      deces:
        type: fields
        fields:
          deces_titre:
            label: Titre
            type: text
          deces_texte:
            label: Paragraphe
            type: textarea
            size: medium
          deces_bouton_texte:
            label: Texte du bouton
            type: text
            width: 1/2
          deces_bouton_url:
            label: URL du bouton
            type: url
            width: 1/2

  seo:
    extends: tabs/seo
