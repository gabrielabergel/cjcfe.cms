title: Notre histoire

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeTemplate: false
  changeSlug: true
  delete: true
  changeStatus: true

tabs:
  content:
    label: Mise en page
    icon: grid
    fields:
      titre:
        label: Titre
        type: blocks
        width: 1/3
        fieldsets:
          - heading
      soustitre:
        label: Sous-titre
        type: blocks
        width: 1/3
        fieldsets:
          - text
      cover:
        label: Cover
        type: files
        width: 1/3
        max: 1
        uploads:
          template: image
      layout:
        label: Contenu
        type: layout
        layouts:
          - "1/1"
          - "1/2, 1/2"

  seo:
    extends: tabs/seo
